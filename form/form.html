        <h1>Formulario de Registro</h1>

    <form action="formulario" class="form" id="form">
        <div class="informacionP">

            <label for="nombre">Nombre completo: </label>
            <input type="text" id="nombre" name="name">

            <label for="tipoI">Tipo de  Identificación: </label>
                <select name="select" id="tipoI" required>
                    <option value="cc">Cedula de Ciudadanía</option>
                    <option value="ti">Tarjeta de Identidad</option>
                    <option value="cedulaExtr">Cedula extrajera</option>
                    <option value="pasaporte">Pasaporte</option>
                    
                </select>
                
                <label for="numeroI">Número de Identificación:</label>
                <input type="tel" name="Número" id="numeroI" required>
                
                <label for="date">Fecha de Nacimiento:</label>
                <input type="date" id="date" name="date" required>

                <label for="tel">Telefono:</label>
                <input type="text" name="TelefonoB" id="tel" autocomplete="tel">
        </div>
        <div class="formulario">
            <label for="email">Correo: </label>
            <input type="email" required name="email" id="email" autocomplete="email">

            <label for="password">Contraseña: </label>
            <input type="password" required id="password" autocomplete="new-password" name="password">
            
            <label for="confirmar">Confirmar Contraseña: </label>
            <input type="password" required name="password" id="confirmar" >
            
            
            <button type="submit" onclick="guardarForm()">Guardar</button>

            <a class="terminos" href="../Terminos_Condiciones/terms.html">Terminos y condiciones</a>

        </div>
    </form>
